<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Momentum Signal Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #58a6ff;
    }
    .subtitle {
      color: #8b949e;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e6edf3;
    }
    input {
      width: 100%;
      padding: 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #58a6ff;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover {
      background: #2ea043;
    }
    .info-box {
      background: #21262d;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #8b949e;
      margin-top: 16px;
    }
    .error {
      background: rgba(248,81,73,0.1);
      border: 1px solid #f85149;
      color: #f85149;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🔐 Login</h1>
    <p class="subtitle">Momentum Signal Tracker</p>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    
    <form method="POST" action="/login">
      <div class="form-group">
        <label>Client ID</label>
        <input type="text" name="client_id" value="A291133" required autofocus>
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" value="9595" required>
      </div>
      
      <button type="submit" class="btn">🚀 Login Now</button>
    </form>
    
    <div class="info-box">
      ℹ️ Session valid for 8 hours. All credentials validated server-side (Python).
    </div>
  </div>
</body>
</html>
