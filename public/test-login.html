<!DOCTYPE html>
<html>
<head>
    <title>Login Test - Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        .log { background: #000; padding: 10px; margin: 5px 0; border-left: 3px solid #0f0; }
        .error { border-left-color: #f00; color: #f00; }
        .success { border-left-color: #0f0; color: #0f0; }
        .info { border-left-color: #ff0; color: #ff0; }
        button { padding: 10px 20px; margin: 10px 0; cursor: pointer; font-size: 16px; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>🔧 Login Debug Test</h1>
    <button onclick="testLogin()">🚀 Test Login</button>
    <button onclick="clearLogs()">🗑️ Clear Logs</button>
    
    <div id="logs"></div>

    <script>
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.getElementById('logs').appendChild(div);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        async function testLogin() {
            log('🔍 Starting login test...', 'info');
            
            try {
                log('📡 Calling /auth/use-config-credentials...', 'info');
                
                const response = await fetch('/auth/use-config-credentials', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                log(`📊 Response status: ${response.status} ${response.statusText}`, 'info');
                
                const data = await response.json();
                log(`📦 Response data: <pre>${JSON.stringify(data, null, 2)}</pre>`, 'info');
                
                if (response.ok && data.status) {
                    log('✅ LOGIN SUCCESS!', 'success');
                    log(`Client ID: ${data.data?.client_id}`, 'success');
                    log(`Session expires in: ${data.data?.session_expires_in} seconds`, 'success');
                } else {
                    log('❌ LOGIN FAILED!', 'error');
                    log(`Error: ${data.message}`, 'error');
                    if (data.error_code) {
                        log(`Error Code: ${data.error_code}`, 'error');
                    }
                }
                
            } catch (error) {
                log('❌ EXCEPTION CAUGHT!', 'error');
                log(`Error: ${error.message}`, 'error');
                log(`Stack: <pre>${error.stack}</pre>`, 'error');
            }
        }

        // Auto-test on load
        log('🌐 Page loaded. Click "Test Login" to start.', 'info');
    </script>
</body>
</html>
